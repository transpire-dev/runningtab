# Our accounts that map onto the account QBO already has, by our number.
# Their names collide with QBO's own, and QBO treats them specially. `role`
# is checked against the chart account's own ERPNext account_type/root_type
# (`validate_qbo_map`) so that this table cannot name the wrong QuickBooks
# built-in for a chart account -- swap "1131" and "2111" below, say, and the
# export refuses instead of quietly posting Receivable balances to QBO's
# Accounts Payable.
[builtin]
"1131" = { name = "Accounts Receivable (A/R)", role = "receivable" }
"2111" = { name = "Accounts Payable (A/P)", role = "payable" }
"3320" = { name = "Retained Earnings", role = "retained_earnings" }

# The account a voucher with more than one AR or AP line is split through.
[clearing]
type = "Other Current Liabilities"
detail = "Other Current Liabilities"


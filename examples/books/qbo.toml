# QuickBooks Online import kit: what QBO cannot infer from chart.coa.
#
# Sources (read 2026-09-22):
#   Account Types (the 15-value list) and the Detail Types grouped under each
#   one:
#     https://quickbooks.intuit.com/learn-support/en-us/banking/how-many-types-of-accounts-does-quickbooks-have-how-many-detail/00/790394
#     https://quickbooks.intuit.com/learn-support/en-us/reports-and-accounting/where-can-i-see-a-complete-list-of-the-account-type-and-detail/00/779890
#   corroborated against the AccountType / AccountSubType enums in Intuit's
#   own SDK reference (a second, independently-maintained copy of the same
#   vocabulary):
#     https://static.developer.intuit.com/sdkdocs/qbv3doc/ippdotnetdevkitv3/html/fe5d46d7-7629-9de7-1011-2b2c2156cc6b.htm
#     https://static.developer.intuit.com/sdkdocs/qbv3doc/ippdotnetdevkitv3/html/50796272-b70e-0c9b-77d9-00c18758396c.htm
#   Built-in account names (Accounts Receivable, Accounts Payable, Retained
#   Earnings) every QBO company has:
#     https://quickbooks.intuit.com/learn-support/en-us/help-article/chart-accounts/learn-chart-accounts-quickbooks-online/L2yc6KBob_US_en_US
#       ("Accounts Payable (A/P): Tracks outstanding bills..." /
#        "Accounts Receivable (A/R): Tracks transactions for customers...")
#     https://quickbooks.intuit.com/learn-support/en-us/help-article/chart-accounts/manage-default-special-accounts-chart-accounts/L3WvLaIfa_US_en_US
#       ("This account reports the net income of your company on the Balance
#        Sheet report" -- naming it "Retained Earnings")
#
# NOT SOURCED -- flagged, not guessed (`period export` needs both):
#   The journal-entry-import CSV's required columns ARE confirmed from
#   Intuit -- Journal No., Journal Date, Account Name, Journal/Description,
#   Debits, Credits --
#     https://quickbooks.intuit.com/learn-support/en-us/help-article/import-export-data-files/import-journal-entries-quickbooks-online/L4tQBwbs7_US_en_US
#   but neither the Journal Date format (MM/DD/YYYY vs DD/MM/YYYY vs other)
#   nor the convention for a line's unused Debits/Credits cell (blank vs "0")
#   is stated in that article's text, in its UK/CA counterparts, or in any
#   community thread found. The one concrete fact found -- "Journal entry
#   lines must only have credits or debits, not both" -- confirms the two
#   columns are mutually exclusive per line but not which of blank/zero is
#   expected. Both only appear inside the in-app "Download a sample file"
#   link, which QBO generates after sign-in and which was not reachable with
#   WebFetch/WebSearch/curl (curl to the article itself also failed: HTTP/2
#   stream error, likely bot-blocked). A human with a QBO login needs to open
#   Settings > Import Data > Journal Entries > Download a sample file and
#   report back what it contains.
#
#   Until that manual check, `period export` uses
#   ISO `%Y-%m-%d` for Journal Date and leaves the unused Debits/Credits cell
#   blank. Both are UNVERIFIED against a real QBO import until someone with a
#   QBO login runs the manual trial-company import above.
#
# One entry per postable chart account. `runningtab period export` refuses a chart
# account with no entry, so a new account cannot quietly drop out of the kit.


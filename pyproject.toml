[project]
name = "runningtab"
version = "0.1.0"
description = "Keep a company's books in ERPNext: apply a chart of accounts, ingest the bank, close the quarter"
readme = "README.md"
authors = [{ name = "Gavin Carothers", email = "gavin@carothers.name" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"

dependencies = [
    "icedcoffee-sync==0.1.0.dev9",
    "httpx2>=2.0.0",
    "typer>=0.15.0",
    "google-cloud-secret-manager>=2.20.0",
    "google-cloud-storage>=2.10.0",
]

[project.scripts]
runningtab = "runningtab.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-timeout>=2.4.0",
    "deptry>=0.24.0",
    "ty>=0.0.1a32",
    "ruff>=0.14.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runningtab"]

[tool.pytest.ini_options]
timeout = 180
timeout_method = "thread"
markers = [
    "live_runningtab: hits a real Frappe site; requires RUNNINGTAB_LIVE=1 (plus RUNNINGTAB_TEST_* to point at a bench instead of the stored test-site key)",
]

[tool.ty.environment]
python-version = "3.14"

[tool.ruff]
target-version = "py314"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    "YTT", # flake8-2020
    "S",   # flake8-bandit
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "T10", # flake8-debugger
    "SIM", # flake8-simplify
    "I",   # isort
    "C90", # mccabe
    "E", "W", # pycodestyle
    "F",   # pyflakes
    "PGH", # pygrep-hooks
    "UP",  # pyupgrade
    "RUF", # ruff
    "TRY", # tryceratops
]
ignore = [
    "E501",   # LineTooLong
    "E731",   # DoNotAssignLambda
    "TRY003", # raise-vanilla-args
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101", "S105"]

[tool.ruff.format]
preview = true

[tool.ruff.lint.flake8-bugbear]
# typer declares options as default arguments.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
